# buff-plugin.toml — `math_hover` example LSP plugin.
#
# An LSP plugin that provides hover docs for math operations (+, -,
# *, /) and a "Replace with saturating_add" code action.
#
# Register this entry_point at host startup via:
#
#   buff_plugins::register_static!(
#       static_reg, lsp,
#       "math_hover::MathHoverPlugin",
#       || Box::new(math_hover::MathHoverPlugin)
#   );
#
# See `examples/plugins/math_hover.rs` for the full plugin source.

name = "math-hover"
version = "0.1.0"
kind = "lsp"
entry_point = "math_hover::MathHoverPlugin"
description = "Adds hover docs + refactors for math operators (+, -, *, /)."
