# - `teloxide` 0.13: the de-facto pure-Rust Telegram bot framework
#   (the canonical Rust library for the Telegram Bot API). API surface
#   used:
#   * `teloxide::Bot::new(token)` for the bot client.
#   * `teloxide::repl(bot, handler).await` for the simple long-polling
#     REPL that dispatches incoming messages to our closure.
#   * `teloxide::types::Message::{text, chat, from}` for converting
#     Telegram's Message to our platform-agnostic Message.
#   * `teloxide::types::ChatId` (i64 newtype) + the positive-ID-is-DM
#     heuristic for `is_dm` detection.
#   Features enabled: `rustls` (pure-Rust TLS via rustls). `default-
#   features = false` drops the default-on `native-tls` — matches the
#   workspace hard rule.
#   Pinned to major 0.13 (the long-standing surface since 2024 —
#   `Bot::new` + `teloxide::repl` + `Message::{text, chat, from}` API
#   has been stable across 0.12/0.13). NOT 0.14+ until verified on
#   the pinned 1.95.0 toolchain.
#
# - `async-trait` 0.1: required by serenity 0.12's EventHandler trait
#   (serenity re-exports it as `serenity::async_trait` but we add the
#   workspace pin so the bridge module can `use async_trait::async_trait`
#   directly if needed). Pure-Rust, no native deps.
#
# All three are recorded in the codegen `extern_crates` BTreeSet when
# a Buff program uses `Bot.*` (mirrors the chrono / regex / tracing /
# lettre codegen-only linking boundary: the single-file `buff run`
# rustc path does NOT link them; cargo-project wiring is deferred per
# the existing precedent). Snapshots + extern_crates set is the
# verifiable contract.
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model"] }
teloxide = { version = "0.13", default-features = false, features = ["rustls", "ctrlc_handler"] }
async-trait = "0.1"
# T47: `buff-chat` workspace path dep — mirrors the buff-image /
# buff-pubsub / buff-email pattern so any future consumer
# (codegen-lowered `Bot.new(...)` / `bot.*` calls, IDE
# hover/completion, the T139 bufflings bot tutorial) resolves to the
# same in-tree version during the v1.17 frameworks wave. Records
# `buff-chat` (NOT `buff_lang_chat` — the framework-crate naming
# convention drops the `-lang` infix per AGENTS.md).
buff-chat = { path = "crates/buff-chat" }
# T51: `buff-msgpack` workspace path dep — MessagePack binary format
# wrapping `rmp-serde`. Mirrors the buff-image / buff-audio / buff-dsp
# pattern so any future consumer (codegen-lowered `MsgPack.serialize(...)`
# / `MsgPack.deserialize(...)` calls, IDE hover/completion) resolves to
# the same in-tree version during the v1.13 frameworks wave. Records
# `buff-msgpack` (NOT `buff_lang_msgpack` — the framework-crate naming
# convention drops the `-lang` infix per AGENTS.md).
buff-msgpack = { path = "crates/buff-msgpack" }
# T45: `buff-geo` MVP — geospatial / GIS primitives for Buff. Wraps the
# pure-Rust `geo` + `geo-types` crates (the de-facto Rust ecosystem
# default for geospatial primitives — the geo-rs org's maintained
# successor to `rust-geo`). Pure-Rust, no native C deps, no cc-rs, no
# assembler shims — matches the "no C library, no Docker" hard rule
# from T126/T127 and the wider workspace stance that killed
# chumsky/logos/zmq.
#
# API surface used (all stable since 0.28):
# - `geo_types::Point::<f64>::new(x, y)` for `Point.new(x, y)`.
# - `geo_types::LineString::<f64>::from(vec![points])` for
#   `LineString.new(points)` / `LineString.from_coords(coords)`.
# - `geo_types::Polygon::<f64>::new(outer_ring, vec![])` for
#   `Polygon.new(outer_ring)` (no interior holes for MVP).
# - `geo::algorithm::{EuclideanDistance, EuclideanLength, Area,
#   Contains, Intersects, BooleanOps}` for the distance/length/area/
#   contains/intersects/buffer ops the T45 surface mandates.
# - `geo::algorithm::webmercator::WebMercator` OR the inline EPSG:3857
#   closed-form for `Projection.wgs84_to_web_mercator(point)`.
#
# Pinned to major 0.28 (released 2024 — the long-standing surface most
# of the Rust ecosystem targets). 0.28 finalised the
# `algorithm::{EuclideanDistance, EuclideanLength, Area, Contains,
# Intersects, BooleanOps}` trait surface we depend on; pre-0.28 had a
# slightly different `BooleanOps` API that would require source
# rewriting. `geo-types` is tracked in lockstep with `geo` (the
# umbrella re-exports it). Mirrors the conservative-pin philosophy
# already in use across the workspace (chrono 0.4, rand 0.8, axum
# 0.8, image 0.25).
#
# The crate is recorded in the codegen `extern_crates` BTreeSet when a
# Buff program uses `Point` / `LineString` / `Polygon` / `Projection`
# (mirrors the chrono / regex / tracing / image codegen-only linking
# boundary: the single-file `buff run` rustc path does NOT link it;
# cargo-project wiring is deferred per the existing precedent).
# Snapshots + extern_crates set is the verifiable contract.
geo = "0.28"
# T45: `geo-types` is sibling-tracked with `geo` (the umbrella
# re-exports the types but we depend on the source crate directly for
# the `Point::<f64>` / `LineString::<f64>` / `Polygon::<f64>`
# constructors). Same version as `geo` (lockstep per the geo-rs org
# release cadence).
geo-types = "0.7"
# T45: `geohash` is the pure-Rust geohash encoder/decoder (the
# canonical Rust ecosystem default — stable since 0.13). Optional
# utility for the future `Point.geohash()` instance method; not
# required for the T45 MVP surface (distance/area/buffer/intersect)
# but workspace-pinned so a follow-up can splice it without
# re-pinning. Mirrors the chrono 0.4 / rand 0.8 conservative-pin
# philosophy already in use across the workspace.
geohash = "0.13"
# T45: `buff-geo` workspace path dep — mirrors the buff-image /
# buff-msgpack pattern so any future consumer (codegen-lowered
# `Point.new(...)` / `LineString.new(...)` / `Polygon.new(...)` /
# `Projection.*` calls, IDE hover/completion, T139 bufflings geo
# tutorial) resolves to the same in-tree version during the v1.18
# frameworks wave. Records `buff-geo` (NOT `buff_lang_geo` — the
# framework-crate naming convention drops the `-lang` infix per
# AGENTS.md).
buff-geo = { path = "crates/buff-geo" }
# T49: `buff-crypto-extras` deps — AES-GCM + RSA + ECDH (P-256/P-384)
# + Argon2 raw KDF. Five pure-Rust RustCrypto crates cover the extern
# surface per the T4 FFI guide (no `ring`, no `aws-lc-rs`, no `cc-rs`
# — the workspace hard rule). Added by T49 (this commit) because the
# crate cannot resolve without these workspace pins.
#
# - `aes-gcm` 0.10: RustCrypto AEAD. API used: `Aes256Gcm::new(key)`,
#   `cipher.encrypt(nonce, pt)`, `cipher.decrypt(nonce, ct)`. AES-256-
#   GCM is the only AES mode Buff exposes (raw AES-ECB / AES-CBC are
#   NOT authenticated and the T49 spec mandates "no homebrew crypto").
#   Default features suffice (no `heapless` / `stream` toggles needed).
#
# - `rsa` 0.9: RustCrypto RSA. API used: `RsaPrivateKey::new`,
#   `RsaPublicKey::from(&private)`, `to_pkcs8_pem`,
#   `to_public_key_pem`, `pkcs1v15::SigningKey::<Sha256>::new`,
#   `sign_with_rng`, `pkcs1v15::VerifyingKey`,
#   `Verifier::verify`. PKCS#1 v1.5 SHA-256 is the deterministic
#   baseline signature scheme with the widest cross-language support
#   (matches OpenSSL / pycryptodome / BouncyCastle /
#   System.Security.Cryptography default). Default features pull
#   `sha2` + `signature` transitively — both already workspace-pinned.
#
# - `p256` 0.13: RustCrypto NIST P-256 elliptic curve. API used:
#   `SecretKey::random(&mut OsRng)`, `to_bytes`,
#   `PublicKey::from_secret_scalar`, `to_encoded_point(false)`,
#   `PublicKey::from_sec1_bytes`, `ecdh::Ecdh::new(scalar, affine)`,
#   `raw_secret_bytes()`. Default features include `ecdh` + the sec1
#   codec (NO `ecdsa` needed because T49 scopes ECC to ECDH; the
#   signature surface lives in T26 Signature / RSA here).
#
# - `p384` 0.13: RustCrypto NIST P-384 elliptic curve. Same API shape
#   as `p256`. P-384 is the next-most-supported curve cross-language;
#   included for the 6/6 cross-language interoperability contract.
#
# - `signature` 2: RustCrypto `Verifier` + `RandomizedSigner` traits
#   used by the RSA sign/verify path. The `rsa` crate re-exports
#   them but we workspace-pin `signature` explicitly so other future
#   crypto wrappers (T26 Signature backend, ECDSA over P-256) reuse
#   the same pin without re-declaring.
#
# `argon2` 0.5, `rand` 0.8, `sha2` 0.10, `hex` 0.4 already pinned at
# the workspace level (T34 / T124b / T124k); T49 reuses those pins.
# All five new pins + the four re-uses are recorded in the codegen
# `extern_crates` BTreeSet when a Buff program uses `AES.*` / `RSA.*`
# / `ECDH.*` / `Argon2.*` (mirrors the chrono/regex/tracing/sha2/
# hmac codegen-only linking boundary: the single-file `buff run`
# rustc path does NOT link them; cargo-project wiring is deferred).
# Snapshots + extern_crates set is the verifiable contract.
aes-gcm = "0.10"
rsa = "0.9"
p256 = "0.13"
p384 = "0.13"
signature = "2"
# T49: `buff-crypto-extras` workspace path dep — mirrors the
# buff-image / buff-geo / buff-msgpack pattern so any future consumer
# (codegen-lowered `AES.encrypt(...)` / `RSA.sign(...)` /
# `ECDH.derive_shared(...)` / `Argon2.derive_key(...)` calls, IDE
# hover/completion, T139 bufflings crypto tutorial) resolves to the
# same in-tree version during the v1.18 frameworks wave. Records
# `buff-crypto-extras` (NOT `buff_lang_crypto_extras` — the framework-
# crate naming convention drops the `-lang` infix per AGENTS.md).
buff-crypto-extras = { path = "crates/buff-crypto-extras" }
# T48: `buff-web3` deps — Ethereum RPC + smart contract bindings.
# `ethers` 2 with the `rustls` feature flag (NOT `native-tls` — the
# workspace hard rule from AGENTS.md "Pure-Rust preference"). API
# surface used (per `crates/buff-web3/src/lib.rs`):
# - `ethers::providers::{Provider, Http, Provider::try_from(url)}` for
#   JSON-RPC connectivity (chain_id / get_block_number / get_balance).
# - `ethers::signers::{LocalWallet, Signer}` for private-key signing
#   (`LocalWallet::from_str(hex_key)` + `wallet.address()`).
# - `ethers::contract::Contract` + `Contract::new(addr, abi, client)`
#   for typed ABI method dispatch.
# - `ethers::abi::{Contract as Abi, Token, Tokenizable}` for ABI
#   de/serialisation.
# - `ethers::types::{Address, H256, U256, U128}` for canonical types.
#
# Pure-Rust on all 3 CI OSes (rustls + ring crypto backend — no native
# C deps, no cc-rs — matches the "no C library" hard rule from T126/
# T127 and the wider workspace stance that pushed hand-rolled lexer/
# parser per AGENTS.md NOTES). The `openssl-sys` crate is NOT pulled
# because the `native-tls` feature is OFF.
#
# Mirrors the chrono/regex/tokio/image/lettre codegen-only linking
# boundary (single-file `buff run` rustc path does NOT link ethers;
# cargo-project wiring is deferred). Snapshots + extern_crates set is
# the verifiable contract.
ethers = { version = "2", default-features = false, features = ["rustls"] }
# T48: `buff-web3` workspace path dep — mirrors the buff-image /
# buff-geo / buff-msgpack / buff-crypto-extras pattern so any future
# consumer (codegen-lowered `Provider.new(...)` / `Wallet.from_*(...)`
# / `Contract.new(...)` calls, IDE hover/completion, T139 bufflings
# web3 tutorial) resolves to the same in-tree version during the v1.18
# frameworks wave. Records `buff-web3` (NOT `buff_lang_web3` — the
# framework-crate naming convention drops the `-lang` infix per
# AGENTS.md).
buff-web3 = { path = "crates/buff-web3" }

# T60: Binary Size Minimization profile.
#
# `cargo build --profile minimal` (selected by `buff build --minimal`)
# produces the smallest possible native binary by combining:
#
# - `inherits = "release"` — start from the optimized release baseline
#   (so we get the `-C opt-level=3` groundwork + the Release LTO head
#   start). The knobs below then push harder on size at the cost of
#   runtime speed + compile time.
# - `panic = "abort"` — replace the `unwind` payload (per-panic
#   landing pads + libunwind linkage on Unix) with a single `abort`
#   shim. This is the single biggest size win on small programs
#   (typically -15..-25% binary size). Trade-off: `catch_unwind`
#   becomes a no-op (panics tear the process down). This is the
#   intended behaviour for size-constrained deployments (Lambda
#   layers, embedded wasm shells, distribution images).
# - `strip = true` — pass `--strip-all` to the linker. Drops symbol
#   tables + debug info from the final binary. Symbols can be
#   re-obtained from `*.dwp`/`*.pdb` sidecars (kept by `target/`).
# - `opt-level = "z"` — LLVM optimize for SIZE (vs `"3"` for speed).
#   Trades runtime performance (typically +5..15% slower) for binary
#   size (typically -5..10% smaller). The single setting that
#   distinguishes `--minimal` from `--release`.
# - `lto = true` — whole-program Link-Time Optimization (same flavour
#   as `Release`, just applied to a size-first optimisation pass).
#   Lets LLVM eliminate dead code across crate boundaries that the
#   per-crate `opt-level` pass cannot see.
# - `codegen-units = 1` — force a single LLVM codegen unit so the
#   whole program is visible to every optimisation pass (mandatory
#   for `lto = true` to deliver its full benefit). Slower compile,
#   smaller binary.
#
# Acceptance target: console-template Buff app builds <5 MB with
# `--minimal`. Measured via `cargo build --profile minimal` on a
# no-extern single-file `.buff` (see `examples/minimal_console.buff`).
#
# **Workspace-root placement**: per AGENTS.md, `[profile.*]` sections
# are forbidden in crate-level Cargo.toml; they live HERE at the
# workspace root. This is the canonical Cargo convention — profiles
# are workspace-wide, never per-crate.
#
# **Opt-in**: this profile is NOT the default. `cargo build` produces
# debug binaries; `cargo build --release` produces Release binaries.
# Users opt in to Minimal via `buff build --minimal` (single-file) or
# `cargo build --profile minimal` (in a generated cargo project).
[profile.minimal]
inherits = "release"
panic = "abort"
strip = true
opt-level = "z"
lto = true
codegen-units = 1
