# surface per the T4 FFI guide. Added by T31 (this commit) because
# T34 created crates/buff-auth without registering the workspace
# deps — workspace glob `crates/*` cannot load buff-auth otherwise,
# which blocks every sibling crate's `cargo check`. Versions chosen
# to match the wider RustCrypto ecosystem pin philosophy:
# - `jsonwebtoken` 9: HS256/RS256/ES256 via the `rust_crypto`
#   backend (NOT `ring` / `aws-lc-rs` — pure-Rust, no cc-rs).
# - `argon2` 0.5: RustCrypto Argon2id PHC-string format (pure-Rust).
# - `oauth2` 4: rustls-tls via reqwest (NOT native-tls).
# All three are recorded in `extern_crates` when a Buff program
# uses `JWT.*` / `OAuth2Client.*` / `Password.*` (mirrors the
# chrono/regex/tracing codegen-only linking boundary).
jsonwebtoken = "9"
argon2 = "0.5"
oauth2 = "4"
# T39: `zip` crate — pure-Rust ZIP read+write. We pin to major 2
# (the long-standing stable surface since the 1.x → 2.x graduation;
# `zip::ZipWriter::new`, `start_file`, `finish`, `ZipArchive::new`,
# `by_index`, `extract` are all stable across both majors). The
# default features pull in C libzstd transitively (via the optional
# `zstd` feature flag → `zstd` crate → `zstd-sys` → `cc-rs` build of
# the upstream C `libzstd` source). That violates the buff workspace's
# hard "no C library, no cc-rs, no native-tls" rule from AGENTS.md
# (same family that killed chumsky/logos/zmq per the NOTES section).
# We disable default features and enable ONLY the pure-Rust `deflate`
# codec (which uses `flate2` with the `miniz_oxide` pure-Rust backend
# already pinned at the workspace level for T139). This drops support
# for zstd-compressed entries INSIDE zip files (still uncommon in the
# wild; deflate remains the dominant zip codec). NO encryption, NO
# bzip2, NO lzma, NO ppmd, NO xz, NO aes-crypto — all of which either
# pull C deps or are explicitly forbidden by the T39 task spec
# ("Must NOT do: No 7z, RAR, BZip2; no encryption-at-rest"). Pure-Rust
# on all 3 CI OSes; mirrors the chrono/regex/tokio/tar/flate2
# codegen-only linking boundary (single-file `buff run` rustc path
# does NOT link zip; cargo-project wiring is deferred). Snapshots +
# extern_crates set is the verifiable contract.
zip = { version = "2", default-features = false, features = ["deflate"] }
# T39: `ruzstd` crate — pure-Rust Zstandard (RFC 8878) implementation.
# We use `ruzstd` (NOT the canonical `zstd` crate) because the
# canonical crate wraps C `libzstd` via `zstd-sys`'s `cc::Build::compile()`
# build script (invokes the C compiler on Facebook's zstd C source).
# That violates the buff workspace's hard "no C library, no cc-rs"
# rule from AGENTS.md (same family that killed chumsky/logos/zmq).
# `ruzstd` 0.8.x ships both `encoding::compress_to_vec(data, level)`
# and `decoding::StreamingDecoder::new(reader)?.read_to_end(&mut out)`
# — full compress+decompress roundtrip in 100% safe Rust (no `unsafe`,
# no native deps, no cc-rs, no assembler shims). Compression ratio /
# speed are below the C libzstd reference but the T39 acceptance only
# requires "Roundtrip compress → extract preserves files" — ratio is
# not on the surface. Pinned to major 0.8 (the long-standing surface
# since 2024 — `CompressionLevel::Fastest` + `StreamingDecoder` API
# has been stable for years). Mirrors the chrono 0.4 / rand 0.8 /
# rustyline 15 / notify 6 / image 0.25 / zip 2 conservative-pin
# philosophy already in use across the workspace.
ruzstd = "0.8"
# T36: `buff-resilience` MVP — resilience patterns (retry + circuit
# breaker + rate limiter + timeout + composable pipeline). The crate
# HAND-ROLLS all four primitives on `std::time` + `std::thread` — it
# does NOT pull `tower` or `governor` even though the T36 task spec
# mentioned them as candidate backends. Rationale:
#
# - `tower`'s `Service` trait is `async`-first (the `Response`
#   associated type is wrapped in a `Future<Output = Result<T, E>>`).
#   Adopting tower would force the Buff surface to be `async` —
#   violating Buff's "no `await`, async propagates invisibly" rule
#   (Buff §6 mandates no `_async` suffix; the language's anti-
#   function-coloring guarantee means users never write `await`).
#   Buff's existing stdlib (`DateTime`, `Regex`, `Hash`, etc.) is
#   sync-only for the same reason.
#
# - `governor` 0.6+ depends on `quanta` for high-resolution timing.
#   `quanta` pulls `cc-rs` on non-x86 targets (it has an asm fallback
#   for x86 but a C shim elsewhere). The same cc-rs-on-Windows-MSVC
#   host issue that pushed the lexer/parser to be hand-rolled (per
#   AGENTS.md NOTES) would block `governor` here. `std::time::Instant`
#   is the pure-Rust alternative; the 1ms-poll cadence it enables is
#   documented in `crates/buff-resilience/src/lib.rs::POLL_CADENCE`.
#
# - The 4 primitives + Pipeline composition are <400 LOC of pure
#   `std::time` + `std::thread` logic. Small enough to hand-roll
#   correctly with full test coverage (27 tests + 5 insta snapshots
#   per the T36 acceptance criteria). Adding tower/governor would
#   inflate compile time + dep tree without buying meaningful
#   robustness for the MVP scope.
#
# Future v1.18+ enhancements may add an async variant of the Pipeline
# (e.g. `PipelineAsync`) backed by `tokio::time::sleep` + `tokio::select!`
# for true timeout cancellation. The current sync Timeout is a SOFT
# timeout — it spawns the handler on a worker thread and polls
# `JoinHandle::is_finished()` on a 1ms cadence; if the deadline
# elapses, the join handle is dropped (worker thread continues in
# the background until it finishes). This is the only safe way to
# enforce a timeout in pure Rust without async.
#
# Pure-Rust, no native C deps, no cc-rs — matches the "no C library,
# no Docker" hard rule from T126/T127. Mirrors the buff-image /
# buff-template / buff-dsp / buff-dataframe / buff-fuzz / buff-audit
# pattern so any future consumer (codegen-lowered `Pipeline.new()` /
# `RetryPolicy.*` / `CircuitBreaker.*` / `RateLimiter.*` / `Timeout.*`
# calls, IDE hover/completion) resolves to the same in-tree version
# during the v1.16 frameworks wave. Records `buff-resilience` (NOT
# `buff_lang_resilience` — the framework-crate naming convention
# drops the `-lang` infix per AGENTS.md).
buff-resilience = { path = "crates/buff-resilience" }
