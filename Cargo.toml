[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
syn = { version = "2.0", features = ["full", "parsing", "printing", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
prettyplease = "0.2"
insta = "1.40"
proptest = "1.5"
wgpu = "26.0"
rayon = "1.10"
tokio = { version = "1.40", features = ["full"] }
bytemuck = { version = "1.18", features = ["derive"] }
pollster = "0.4"
rust_decimal = "1.36"
rust_decimal_macros = "1.36"
unicode-segmentation = "1.12"
# T124b: DateTime / Date / Time / Duration / Instant prelude types wrap the
# mature `chrono` crate. We prefer chrono over `time` because chrono ships
# timezone-aware `DateTime<Utc>` (with full RFC 3339 parse/format), rich
# `TimeDelta` arithmetic, and the de-facto strftime-style formatting users
# expect. `time` v0.3 has stricter semantics but a leaner API and was for
# a long time unable to represent some constructs chrono handled natively
# (notably zoned formatting). See `crates/buff-lang-types/src/prelude_types.rs`
# for the prelude-type registry that consumes chrono at codegen time.
chrono = "0.4"
# T124c: Log module (Log.debug/info/warn/error) wraps the `tracing` crate
# for structured logging, with `tracing-subscriber` providing the fmt layer
# (pretty to stderr in dev, JSON to stdout in release) + `EnvFilter` for
# `BUFF_LOG=debug` style runtime level control. Both crates are recorded
# in the codegen `extern_crates` BTreeSet when a Buff program uses `Log`,
# mirroring the chrono/tokio codegen-only linking boundary (single-file
# `buff run` rustc path does NOT link them; cargo-project wiring is
# deferred). Feature flags: `env-filter` enables `EnvFilter`; `json`
# enables the JSON formatter layer.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# T124d: Regex module (Regex.compile + regex.match/find/replace/captures)
# wraps the mature `regex` crate. We use `regex` over `fancy-regex` or
# `pcre2` because the upstream `regex` crate ships a linear-time
# guarantees engine (no catastrophic backtracking), is the de-facto
# Rust ecosystem default, and exposes a stable surface since 1.0 — every
# method we lower to (`is_match`, `find`, `replace_all`, `captures`,
# `capture_locations`, named-group iteration via `iter()` over
# `captures.iter()`) has been stable for years. Recorded in the codegen
# `extern_crates` BTreeSet when a Buff program uses `Regex`, mirroring
# the chrono/tracing codegen-only linking boundary (single-file `buff
# run` rustc path does NOT link it; cargo-project wiring is deferred).
regex = "1"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# T114: Wasm transpile-only playground. wasm-bindgen + panic hook for
# browser-side transpilation. The version floats within the 0.2.x range
# (the workspace resolver picks one compatible with all dependents — wgpu
# requires >=0.2.100, so the resolved version is matched by installing
# wasm-bindgen-cli at the same exact version). See playground/README.md
# for the version-pinning procedure.
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1.7"
# T117: LSP server scaffolding (rust-analyzer's JSON-RPC framework) + the
# canonical LSP types crate. Both pin to the published crates.io versions
# (no path deps). `lsp-types` 0.97 implements LSP 3.17; `lsp-server` 0.10
# is the small stdio/JSON-RPC scaffold extracted from rust-analyzer. Both
# are wasm-free, sink-only deps — pure Rust.
lsp-server = "0.10"
lsp-types = "0.97"
# `url` is required by lsp-types for `Url`. Workspace pin keeps it in sync
# with any future transitive consumers.
url = "2"
# `crossbeam-channel` is the channel type used by `lsp-server::Connection`.
# Already pulled transitively; pinning at workspace level keeps it explicit
# so the LSP crate can use synchronous `select!` for debouncing.
crossbeam-channel = "0.5"
# T124f: Random module (Random.int / Random.float / Random.choice /
# Random.shuffle) wraps the `rand` crate. We pin rand 0.8 (NOT 0.9)
# because rand 0.8 ships the stable, long-standing API surface most of
# the Rust ecosystem already targets:
#   - `rand::thread_rng().gen_range(min..=max)` for inclusive integer range
#   - `rand::thread_rng().gen::<f64>()` for [0, 1) float
#   - `rand::seq::SliceRandom::{choose, shuffle}` for collection ops
# rand 0.9 (released 2024) renamed the API (`rng()` instead of
# `thread_rng()`, `random_range()` instead of `gen_range()`,
# `IndexedRandom` instead of part of `SliceRandom`) - targeting 0.8
# keeps the codegen-lowered calls stable across the wider ecosystem
# (chrono / tracing / regex / toml already pin pre-1.0 majors too).
# Recorded in the codegen `extern_crates` BTreeSet when a Buff program
# uses `Random`, mirroring the chrono/toml/regex/tracing codegen-only
# linking boundary (single-file `buff run` rustc path does NOT link it;
# cargo-project wiring is deferred).
rand = "0.8"
# T124h: Web modules (Base64 / Hex / URLEncode / UUID / URL) wrap four
# mature Rust crates. Each codegen-lowered call uses fully-qualified
# paths so generated code requires no `use` import - but the recorded
# name in `extern_crates` signals to the pipeline / build-driver that
# the generated Cargo project must declare each crate in
# `[dependencies]`.
#
# - `base64` 0.22: STANDARD engine via the `Engine` trait. Codegen uses
#   UFCS (`base64::Engine::encode(&STANDARD, ...)`) so the trait need
#   not be imported into generated code.
# - `hex` 0.4: free functions `hex::encode` / `hex::decode` (no trait
#   import needed).
# - `percent-encoding` 2.x: `utf8_percent_encode` / `percent_decode_str`
#   + the pre-defined `NON_ALPHANUMERIC` AsciiSet.
# - `uuid` 1.x: `Uuid::new_v4` / `Uuid::now_v7` / `Uuid::parse_str`.
#   Features `v4` + `v7` enable the constructors; `rng-getrandom` (the
#   default RNG backend) is enabled implicitly by `v4` / `v7`.
#
# `url` is already pinned at the workspace level (T117 LSP server uses
# it transitively via lsp-types); T124h reuses that pin.
#
# Mirrors the chrono/tracing/regex/toml/rand/tokio codegen-only linking
# boundary (single-file `buff run` rustc path does NOT link them;
# cargo-project wiring is deferred). Snapshots + extern_crates set is
# the verifiable contract.
base64 = "0.22"
hex = "0.4"
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "v7"] }
# T124i: Data-format modules (Yaml / Csv) wrap two mature Rust crates.
# Each codegen-lowered call uses fully-qualified paths so generated code
# requires no `use` import - but the recorded name in `extern_crates`
# signals to the pipeline / build-driver that the generated Cargo project
# must declare each crate in `[dependencies]`.
#
# - `serde_yml` 0.0.12: the maintained fork of the deprecated/archived
#   `serde_yaml` crate (which is NO LONGER MAINTAINED as of 2024). Same
#   API surface: `serde_yml::from_str::<T>(s) -> Result<T, Error>` and
#   `serde_yml::to_string(&v) -> Result<String, Error>` + the dynamic
#   `serde_yml::Value` enum. We pin to 0.0.x because serde_yml has not
#   cut a 1.0 yet (the API has been stable since 0.0.9 but the version
#   remains pre-1.0). Mirrors the rand 0.8 + chrono 0.4 "pin pre-1.0
#   major" precedent (NOT the latest major).
#
# - `csv` 1.x: the long-standing burntsushi/rust-csv crate. API used:
#   `csv::ReaderBuilder::new().has_headers(false).from_reader(...)` to
#   parse CSV text into `Vec<Vec<String>>` (uniform rows, NO header
#   special-casing per the spec); `csv::Writer::from_writer(Vec::new())`
#   + `write_record` + `into_inner()` to serialize. Stable since 1.0
#   (years), so the `1` major-only pin is the conservative choice.
#
# Mirrors the chrono/tracing/regex/toml/rand/tokio/base64/hex/percent-
# encoding/uuid/url codegen-only linking boundary (single-file `buff
# run` rustc path does NOT link them; cargo-project wiring is
# deferred). Snapshots + extern_crates set is the verifiable contract.
serde_yml = "0.0.12"
csv = "1"
# T124j: Filesystem modules (Path / Dir / Tempfile) wrap two mature
# Rust crates + std::path / std::fs. Each codegen-lowered call uses
# fully-qualified paths so generated code requires no `use` import -
# but the recorded name in `extern_crates` signals to the pipeline /
# build-driver that the generated Cargo project must declare each
# crate in `[dependencies]`.
#
# - `walkdir` 2.x: the burntsushi/walkdir crate. Used by `Dir.walk(p)`
#   which lowers to `walkdir::WalkDir::new(p).into_iter()
#   .filter_map(|e| e.ok()).map(|e| e.path().to_path_buf())
#   .collect::<Vec<std::path::PathBuf>>()`. We pin to the 2.x major
#   (the long-standing API surface - `WalkDir::new(p).into_iter()` is
#   stable since 2.0).
# - `tempfile` 3.x: the stebalian/tempfile crate. Used by
#   `Tempfile.create()` which lowers to `tempfile::NamedTempFile::new()
#   .map(|f| f.into_temp_path().keep().unwrap_or_default())
#   .unwrap_or_default()` (panic-free - empty PathBuf on failure).
#   `Tempfile.dir()` uses `std::env::temp_dir()` (NO extern crate -
#   `tempfile::env::temp_dir()` is a re-export of the std fn, so we
#   splice the std path directly).
#
# NOTE: `Path` (value type) + `Dir.list/create/remove` + `Path.exists`
# wrap `std::path::Path`/`PathBuf` + `std::fs::read_dir`/
# `create_dir_all`/`remove_dir_all`/`Path::exists`. std-only - NO
# extern crate recorded for those (mirrors the Math/Strings/Args/Env
# stance from T124f/T124g).
#
# Mirrors the chrono/tracing/regex/toml/rand/tokio/base64/hex/percent-
# encoding/uuid/url/serde_yml/csv codegen-only linking boundary
# (single-file `buff run` rustc path does NOT link them; cargo-project
# wiring is deferred). Snapshots + extern_crates set is the verifiable
# contract.
walkdir = "2"
tempfile = "3"
# T124k: Crypto modules (Hash / HMAC) wrap three mature RustCrypto crates.
# Each codegen-lowered call uses fully-qualified paths so generated code
# requires no top-level `use` import - but the recorded name in
# `extern_crates` signals to the pipeline / build-driver that the
# generated Cargo project must declare each crate in `[dependencies]`.
#
# - `sha2` 0.10: the RustCrypto SHA-2 family. API surface used:
#   `sha2::Sha256::digest(data.as_bytes())` (one-shot digest via the
#   `Digest` trait - codegen emits a block-scoped `use sha2::Digest;` so
#   the trait method is in scope at the call site without polluting the
#   caller's namespace) + `sha2::Sha512::digest(...)` for SHA-512.
#   Returns a `GenericArray<u8, _>` that `hex::encode` accepts via
#   `AsRef<[u8]>`. The `sha2` crate is shared between `Hash.sha256` /
#   `Hash.sha512` (both narrow walkers record it) AND `HMAC.sha256`
#   (HMAC wraps `hmac::Hmac<sha2::Sha256>`).
# - `md5` 0.7: the RustCrypto MD5 crate. API surface used:
#   `md5::compute(data.as_bytes()).0` (returns `md5::Digest`, a tuple
#   struct wrapping `[u8; 16]`; `.0` accesses the byte array).
#   MD5 is CRYPTOGRAPHICALLY BROKEN - exposed for checksum compatibility
#   only (mirrors how md5 is used in the Rust ecosystem today: etags,
#   content-addressable caches, legacy interop). NEVER use for security.
# - `hmac` 0.12: the RustCrypto HMAC crate. API surface used:
#   `hmac::Hmac::<sha2::Sha256>::new_from_slice(key.as_bytes())`
#   (returns `Result<Hmac<Sha256>, MacError>` - codegen `.map(...)`s the
#   Ok branch and falls back to an empty String via `.unwrap_or_default()`
#   on Err - NEVER panics) then `mac.update(data.as_bytes())` +
#   `mac.finalize().into_bytes()` (returns `GenericArray<u8, _>`). The
#   `update` / `finalize` methods are on the `Mac` trait - codegen emits
#   a block-scoped `use hmac::Mac;` so the trait methods are in scope.
#
# `hex` is already pinned at the workspace level (T124h); T124k reuses
# that pin for the hex-encode lowering of every Hash / HMAC digest.
#
# Mirrors the chrono/tracing/regex/toml/rand/tokio/base64/hex/percent-
# encoding/uuid/url/serde_yml/csv/walkdir/tempfile codegen-only linking
# boundary (single-file `buff run` rustc path does NOT link them;
# cargo-project wiring is deferred). Snapshots + extern_crates set is
# the verifiable contract.
sha2 = "0.10"
md5 = "0.7"
hmac = "0.12"
# T124l: System modules (Process / OS). `Process.*` + `OS.name` /
# `OS.arch` / `OS.hostname` use ONLY Rust `std` (std::process::Command /
# Child / exit + std::env::consts::{OS,ARCH} + env-var hostname fallback)
# - NO extern crate recorded for those (mirrors Math/Strings/Args/Env/
# Path stance from T124f/T124g/T124j).
#
# `OS.cpus()` wraps the `num_cpus` crate (the long-standing Sean
# McArthur / autoscreenshot num_cpus crate - the de-facto Rust ecosystem
# default for CPU-count detection since 1.0; API used:
# `num_cpus::get() -> usize` - the canonical "how many logical CPUs
# does this machine have?"). Recorded in the codegen `extern_crates`
# BTreeSet when a Buff program uses `OS.cpus` (the narrow walker flags
# ONLY the `cpus` method name; `OS.name` / `OS.arch` / `OS.hostname`
# do NOT record it - they use std only).
#
# NOTE: `OS.hostname()` does NOT use a dedicated hostname crate
# (the spec explicitly forbids adding one). It lowers to
# `std::env::var("COMPUTERNAME").or_else(|_| std::env::var("HOSTNAME"))
# .unwrap_or_default()` - the bare-minimum env-var approach covering
# Windows (COMPUTERNAME) + Unix (HOSTNAME). Empty String when neither
# env var is set (NEVER panics - matches Buff's "no panicking generated
# code" rule).
#
# Mirrors the chrono/tracing/regex/toml/rand/tokio/base64/hex/percent-
# encoding/uuid/url/serde_yml/csv/walkdir/tempfile/sha2/md5/hmac
# codegen-only linking boundary (single-file `buff run` rustc path does
# NOT link num_cpus; cargo-project wiring is deferred). Snapshots +
# extern_crates set is the verifiable contract.
num_cpus = "1"
# T124m: Networking modules (TCP / UDP / WebSocket) wrap tokio's
# TcpStream + UdpSocket (already pinned via `tokio` at line 14 - the
# `tokio = { version = "1.40", features = ["full"] }` flag pulls in
# `tokio::net::*` + `tokio::io::*`) PLUS the `tokio-tungstenite` crate
# for WebSocket support (the maintained tokio binding for the
# `tungstenite` WebSocket protocol crate - the de-facto Rust ecosystem
# default for async WebSockets; API used: `tokio_tungstenite::connect_async
# (url).await -> Result<(WebSocketStream<MaybeTlsStream<TcpStream>>, Response), Error>` and the
# `WebSocketStream`'s `SinkExt` / `StreamExt` methods for send / recv /
# close via the `futures-util` crate). `futures-util` provides the
# `SinkExt` + `StreamExt` traits the WebSocket send / recv lowerings
# invoke (block-scoped `use futures_util::SinkExt;` /
# `use futures_util::StreamExt;` so the trait methods are in scope at
# the call site without polluting the caller's namespace).
#
# Mirrors the chrono/tracing/regex/toml/rand/tokio/base64/hex/percent-
# encoding/uuid/url/serde_yml/csv/walkdir/tempfile/sha2/md5/hmac/
# num_cpus codegen-only linking boundary (single-file `buff run` rustc
# path does NOT link them; cargo-project wiring is deferred). Snapshots
# + extern_crates set is the verifiable contract.
tokio-tungstenite = "0.24"
futures-util = "0.3"
buff-lang-ast = { path = "crates/buff-lang-ast" }
buff-lang-lexer = { path = "crates/buff-lang-lexer" }
buff-lang-parser = { path = "crates/buff-lang-parser" }
buff-lang-types = { path = "crates/buff-lang-types" }
buff-lang-codegen-rust = { path = "crates/buff-lang-codegen-rust" }
buff-lang-codegen-wgsl = { path = "crates/buff-lang-codegen-wgsl" }
buff-lang-runtime = { path = "crates/buff-lang-runtime" }
buff-lang-error = { path = "crates/buff-lang-error" }
buff-lang-cli = { path = "crates/buff-lang-cli" }
buff-lsp = { path = "crates/buff-lsp" }
# T125-prep: thin evaluation engine crate. Reuses the existing
# lexer/parser/types/codegen-rust primitives; adds NO new compilation logic.
# The path dep is mirrored at the workspace level so consumers (T125a REPL,
# T129b Jupyter kernel, T138c Bufflings) all resolve to the same in-tree
# version during the v1.x tooling wave.
buff-eval = { path = "crates/buff-eval" }
# T125a: REPL crate (crates/buff-repl). Provides the `buff repl` subcommand's
# interactive read-eval-print loop, layered on top of `buff-eval` for
# evaluation and `rustyline` for line editing / history / Ctrl-D/Ctrl-C
# handling. Mirrors the workspace path-dep pattern so any future consumer
# (Jupyter kernel, IDE integrations) resolves to the same in-tree version.
buff-repl = { path = "crates/buff-repl" }
# T125a: `rustyline` is the readline implementation backing the Buff REPL.
# We pin to major 15 (released 2024-11-15) — recent stable, ships the
# `DefaultEditor::new()` API since 13.x, broad ecosystem adoption. We
# deliberately do NOT chase the latest 18.x because:
# - 15.x is the long-standing surface most REPL-style tools in the Rust
#   ecosystem target (mirrors the rand-0.8-vs-0.9 / chrono-0.4 conservative
#   pin philosophy already in use in this workspace).
# - The DefaultEditor + readline + add_history_entry API surface we depend
#   on is identical across 13/14/15/16/17/18 — pinning 15 gives us room to
#   bump without churn.
# `derive` / `with-dirs` / `with-file-history` features are NOT enabled —
# history persistence is T125c territory (we want a fresh in-memory history
# per session for now).
rustyline = "15"
# T125c: `dirs` resolves the user's home directory for the REPL history
# file (`~/.buff_history`). We pin to major 5 (released 2022) — the
# long-standing surface most of the Rust ecosystem targets. dirs 6.0.0
# (2025) ships the identical `home_dir() -> Option<PathBuf>` API but is
# newer than necessary; pinning 5 mirrors the rand-0.8 / chrono-0.4
# conservative-pin philosophy already in use. The single function we
# consume is `dirs::home_dir()` — no other API surface is touched, so a
# future bump to 6.x is a one-line version change with no code change.
dirs = "5"
# T126: Minimal Buff package registry HTTP server (`crates/buff-registry`).
# We pull three new top-level crates — `axum` (the web framework, already
# the de-facto Rust ecosystem default since 0.5 and the natural successor
# to the `warp`/`rocket` lineage), `tower` (Service trait utilities, used
# only via `ServiceExt::oneshot` for in-process integration tests so we
# do NOT spawn a TCP server per test), and `semver` (the canonical
# Cargo-compatible semver crate — implements `Version` + `VersionReq` and
# the exact match rules Cargo uses, which is what the Buff resolver must
# mirror). Pinning all three at the workspace level mirrors the
# buff-eval / buff-repl / buff-lsp precedent and lets future consumers
# (T127 `buff add`/`buff install` CLI, T128 registry web UI) reuse the
# same versions without churn.
#
# - `axum` 0.8: the Tokio-based HTTP framework. API surface used:
#   `Router::new().route(path, method_router)`, `axum::routing::{get, post}`,
#   `axum::extract::{State, Path, Query}`, `axum::body::Bytes` extractor
#   for the publish body, `Json` for response bodies, `IntoResponse` for
#   the error mapping. The `with_state(state)` pattern lets the library
#   expose a `pub fn app(state) -> Router` that tests build in-process
#   via `Router::oneshot` (no TCP port allocation). Pinned to 0.8 (NOT
#   0.7) because 0.8 introduced the `{param}` path syntax and the
#   `axum::serve(listener, app)` API — both are the current canonical
#   surface; 0.7 is in maintenance only.
# - `tower` 0.5: the `ServiceExt` trait is used in tests ONLY
#   (`tower::ServiceExt::oneshot` to drive a `Router<()>` directly with
#   a `Request<Body>`). The `tower` workspace pin keeps the test
#   dep + any future middleware (tower-http layers like CORS, body
#   limits, tracing) version-aligned with axum. NOT used in non-test
#   code today.
# - `semver` 1.x: the long-standing `semver` crate (the same one Cargo
#   itself depends on). API surface used: `Version::parse`,
#   `VersionReq::parse`, `VersionReq::matches`. `Display` for both
#   produces canonical Cargo-compatible strings, so the resolve
#   endpoint returns the exact form the CLI will compare against.
# Stable since 1.0 (years), so the `1` major-only pin is conservative.
#
# `base64`, `serde`, `serde_json`, `tokio`, `thiserror` are already
# pinned at the workspace level (T124h/T124-base/T124c) and reused here
# without re-pinning. The publish request body carries the tarball as a
# base64-encoded string inside a JSON envelope — pure Rust, no native
# deps, matches the "no C library, no Docker" hard rule from the T126
# task spec.
axum = "0.8"
tower = "0.5"
semver = "1"
# T126: `buff-registry` workspace path dep — mirrors the buff-eval /
# buff-repl / buff-lsp pattern so any future consumer (T127 CLI, T128
# web UI) resolves to the same in-tree version during the v1.6 tooling
# wave.
buff-registry = { path = "crates/buff-registry" }
