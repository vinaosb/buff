# T43: `scraper` 0.22 — the canonical pure-Rust HTML parser + CSS
# selector engine built on `html5ever` (servo's HTML5 parser) +
# `selectors` (servo's CSS selector engine) + `cssparser`. All
# pure-Rust, NO cc-rs, NO native C shim — matches the "no C
# library, no Docker" hard rule from T126/T127 (same family of
# cc-rs-avoidance that pushed hand-rolled lexer/parser per
# AGENTS.md). API surface used by `crates/buff-scrape`:
# - `scraper::Html::parse_document(html: &str) -> Html` (parse)
# - `scraper::Selector::parse(css: &str) -> Result<Selector, SelectorErrorKind>`
#   (CSS selector compile; SelectorErrorKind impls Display)
# - `html.select(&selector) -> Select` (iterator over ElementRef)
# - `html.root_element() -> ElementRef` (root <html> element)
# - `element_ref.value().attr(name) -> Option<&str>` (attribute)
# - `element_ref.text() -> Text` (descendant text-node iterator)
# - `element_ref.html() / inner_html() -> String` (serialization)
# NOTE: scraper::Html + ElementRef are !Send + !Sync (internal
# html5ever tendril borrow graph). buff-scrape works around this
# by caching the source String in Document/Element and re-parsing
# per access (mirrors how Regex caches its pattern + SourceRegistry
# for thread-safety). The wrapper types Document / Element /
# Crawler are Send + Sync — the FFI guide R4 holds at the Buff-
# visible boundary. Pinned to major 0.22 (the long-standing
# surface since 2024 — the Html/Selector/ElementRef API has been
# stable across 0.18-0.27). 0.22 is conservative on Rust 1.95;
# 0.27 (released 2026-05) requires Rust 1.74+ which the pinned
# 1.95.0 toolchain satisfies — bump to 0.27 is a no-op follow-up.
scraper = "0.22"
