[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
logos = "0.14"
chumsky = { version = "1.0.0-alpha.8", features = ["pratt"] }
syn = { version = "2.0", features = ["full", "parsing", "printing", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
prettyplease = "0.2"
insta = "1.40"
proptest = "1.5"
wgpu = "26.0"
rayon = "1.10"
tokio = { version = "1.40", features = ["full"] }
bytemuck = { version = "1.18", features = ["derive"] }
rust_decimal = "1.36"
rust_decimal_macros = "1.36"
unicode-segmentation = "1.12"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
buff-lang-ast = { path = "crates/buff-lang-ast" }
buff-lang-lexer = { path = "crates/buff-lang-lexer" }
buff-lang-parser = { path = "crates/buff-lang-parser" }
buff-lang-types = { path = "crates/buff-lang-types" }
buff-lang-codegen-rust = { path = "crates/buff-lang-codegen-rust" }
buff-lang-codegen-wgsl = { path = "crates/buff-lang-codegen-wgsl" }
buff-lang-runtime = { path = "crates/buff-lang-runtime" }
buff-lang-error = { path = "crates/buff-lang-error" }
