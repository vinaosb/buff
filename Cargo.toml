[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
logos = "0.14"
chumsky = { version = "1.0.0-alpha.8", features = ["pratt"] }
syn = { version = "2.0", features = ["full", "parsing", "printing", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
prettyplease = "0.2"
insta = "1.40"
proptest = "1.5"
wgpu = "26.0"
rayon = "1.10"
tokio = { version = "1.40", features = ["full"] }
bytemuck = { version = "1.18", features = ["derive"] }
rust_decimal = "1.36"
rust_decimal_macros = "1.36"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
deox-ast = { path = "crates/deox-ast" }
deox-lexer = { path = "crates/deox-lexer" }
deox-parser = { path = "crates/deox-parser" }
deox-types = { path = "crates/deox-types" }
deox-codegen-rust = { path = "crates/deox-codegen-rust" }
deox-codegen-wgsl = { path = "crates/deox-codegen-wgsl" }
deox-runtime = { path = "crates/deox-runtime" }
deox-error = { path = "crates/deox-error" }
