# T12: Entity-Component-System backing implementation for `buff-ecs`.
# We pin `hecs` to major 0.10 (the long-standing surface since 2022 —
# every method we lower through codegen: `World::new`, `spawn`,
# `insert_one`, `remove_one`, `get`, `get_mut`, `query`, `query_mut`,
# `despawn`, `len`, `clear`, `reserve_entity` — has been stable for
# years). We prefer `hecs` over `bevy_ecs` because:
#
# - Smaller surface: `hecs::World` + `Entity` + `QueryBorrow` cover
#   100% of the MVP scope (no scheduling, no change detection, no
#   plugins, no reflection). `bevy_ecs` pulls in bevy_utils + bevy_tasks
#   + bevy_reflect and expects to live inside a Bevy app; that is far
#   more than Buff's language-level ECS surface needs.
# - Stable, narrowly-scoped API: every method we lower through codegen
#   has been stable in `hecs` for years; we will not be chasing
#   upstream API churn during the v1.13 frameworks wave.
# - Pure-Rust: no native deps, no cc-rs, no OpenSSL — matches the
#   "no C library, no Docker" hard rule from the T12 task spec and
#   the wider workspace stance that killed chumsky/logos/zmq.
# - Single-crate dependency: `hecs` is one crate; `bevy_ecs` pulls
#   10+ sibling bevy_* crates transitively (logging, platform, async,
#   reflect).
#
# All FFI-safety rules from `crates/buff-lang-ffi-guide/GUIDE.md`
# apply: the `buff-ecs` wrapper exposes only `Entity` (a transparent
# `(u32, u32)` id newtype — no raw pointers), `World`, `System`,
# `SystemFn`, `EcsError`, and the `Component` marker trait (blanket-
# impl over `hecs::Component + Clone + Debug`). Every public entry
# point wraps its body in `std::panic::catch_unwind` per Rule R6.
#
# Mirrors the chrono/tracing/regex/tokio/base64/hex/etc. codegen-only
# linking boundary (single-file `buff run` rustc path does NOT link
# hecs; cargo-project wiring is deferred). Snapshots + extern_crates
# set is the verifiable contract.
hecs = "0.10"
