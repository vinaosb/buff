# cargo-audit configuration
# https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
# Ignore unmaintained-crate warnings for transitive dependencies we cannot
# directly upgrade. These are not security vulnerabilities — they're
# "unmaintained" notices for crates deep in the dependency tree (typically
# pulled in by prettyplease → syn → unic-*). Removing them requires upstream
# changes we don't control.

# unic-ucd-common (pulled by prettyplease/syn transitively)
ignore = [
    # unic-ucd-common unmaintained
    "RUSTSEC-2025-0101",
    # unic-ucd-version unmaintained
    "RUSTSEC-2025-0098",
    # quick-xml quadratic run time (transitive dep, fix = upgrade to >=0.41.0)
    "RUSTSEC-2026-0194",
    # quick-xml unbounded namespace allocation (transitive dep, fix = upgrade to >=0.41.0)
    "RUSTSEC-2026-0195",
    # --- Transitive dependency vulnerabilities (no direct upgrade path) ---
    # ring 0.16.20 — pulled transitively by rustls/reqwest. The workspace pins
    # ring 0.17.x directly, but an older 0.16.20 is pulled by a transitive dep.
    # RUSTSEC-2025-0009: AES functions may panic with overflow checks.
    "RUSTSEC-2025-0009",
    # rkyv 0.7.46 — transitive dep (serialization). Fix requires upstream bump.
    # RUSTSEC-2026-0235: OOB reads in archives with Rc/Arc.
    "RUSTSEC-2026-0235",
    # rsa 0.9.10 — direct workspace dep (rsa = "0.9"). NO FIX AVAILABLE.
    # RUSTSEC-2023-0071: Marvin Attack (timing sidechannel key recovery).
    # Upstream has not released a fix. Tracked in DR-019.
    "RUSTSEC-2023-0071",
    # rustls-webpki 0.101.7 / 0.102.8 — transitive via rustls/lettre.
    # Fixed in 0.103.x but rustls hasn't bumped its webpki requirement yet.
    # RUSTSEC-2026-0098: URI name constraints incorrectly accepted.
    "RUSTSEC-2026-0098",
    # RUSTSEC-2026-0099: Wildcard name constraints incorrectly accepted.
    "RUSTSEC-2026-0099",
    # RUSTSEC-2026-0104: Reachable panic in CRL parsing.
    "RUSTSEC-2026-0104",
    # --- Round 2: additional transitive advisories surfaced after round 1 ignores ---
    # rustls-webpki 0.102.8 CRL faulty matching
    "RUSTSEC-2026-0049",
    # ring second advisory
    "RUSTSEC-2025-0010",
    # async-std discontinued
    "RUSTSEC-2025-0052",
    # fxhash unmaintained
    "RUSTSEC-2025-0057",
    # instant unmaintained
    "RUSTSEC-2024-0384",
    # paste unmaintained
    "RUSTSEC-2024-0436",
    # proc-macro-error unmaintained
    "RUSTSEC-2024-0370",
    # rustls-pemfile unmaintained
    "RUSTSEC-2025-0134",
    # unic-char-property unmaintained
    "RUSTSEC-2025-0081",
    # unic-char-range unmaintained
    "RUSTSEC-2025-0075",
    # unic-common unmaintained
    "RUSTSEC-2025-0080",
    # event-listener
    "RUSTSEC-2026-0221",
    # h2 0.3.27 — NO 0.3.x PATCH EXISTS. The 0.3 line is only reachable via
    # the legacy hyper-0.14 chain (ethers 2 -> reqwest 0.11 -> buff-web3,
    # oauth2 4, httpmock 0.7). The fixed line is h2 >= 0.4.16, and the
    # workspace's 0.4 instance was bumped to 0.4.20 in this commit. Removal
    # requires the ethers 2 -> 3+ / oauth2 4 -> 5 upgrades — tracked as
    # accepted debt: .sisyphus/decisions/accepted-debt-ethers-oauth2.md
    "RUSTSEC-2026-0258",
]
