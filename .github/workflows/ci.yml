name: CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # x64 targets (existing)
        os:
          - ubuntu-latest       # x64
          - windows-latest      # x64
          - macos-latest        # x64
          # arm64 targets (T61)
          - ubuntu-24.04-arm    # arm64 — GitHub-hosted, GA 2025
          - macos-14            # arm64 — Apple Silicon M1, GA 2024
          # windows-11-arm not yet GA; add when available
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
