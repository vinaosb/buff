name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Explicit list of CI-gated crates (core compiler + tooling + working framework crates).
  # Framework MVPs with pre-existing API drift are excluded — tracked as tech debt.
  # To add a crate: fix it with `cargo clippy -p <crate> -- -D warnings`, then add here.
  CI_CRATES: >-
    -p buff-lang-error -p buff-lang-ast -p buff-lang-lexer -p buff-lang-parser
    -p buff-lang-types -p buff-lang-codegen-rust -p buff-lang-codegen-wgsl
    -p buff-lang-codegen-buffhtml -p buff-lang-ast-rsx -p buff-lang-buffhtml-parser
    -p buff-lang-runtime -p buff-lang-debug-info -p buff-lang-cli -p buff-lang-ffi-guide
    -p buff-eval -p buff-repl -p buff-jupyter -p buff-registry
    -p buff-playground-wasm -p buff-ui-dioxus -p buff-dap -p buff-cli
    -p buffup -p bufflings
    -p buff-tensor -p buff-dsp -p buff-ecs -p buff-ml -p buff-pipeline
    -p buff-science -p buff-simd -p buff-actors
    -p buff-cache -p buff-pubsub -p buff-assertions -p buff-fsm
    -p buff-msgpack -p buff-xml -p buff-mock
    -p buff-audio -p buff-config -p buff-email -p buff-i18n -p buff-image
    -p buff-nlp -p buff-observe -p buff-plugins -p buff-reactive
    -p buff-resilience -p buff-archive -p buff-template -p buff-web
    -p buff-chat -p buff-dataframe -p buff-db -p buff-game -p buff-geo
    -p buff-http-client -p buff-lsp -p buff-mcp -p buff-protobuf
    -p buff-scrape -p buff-audit -p buff-validate -p buff-auth

# P0.10 — least-privilege default; jobs needing more override at the job level.
permissions:
  contents: read

jobs:
  # ── cargo-deny (C-library + license gate; HARD gate, no continue-on-error) ──
  # P0.8: enforces the "no C library, no cc-rs, no native-tls" hard rule
  # from AGENTS.md via cargo-deny. Configuration lives in `deny.toml` at
  # the repo root. Documented exceptions (ring, libsqlite3-sys, and the
  # transitive cc-rs they pull) live in `.sisyphus/decisions/` and are
  # hidden from the gate via `bans.skip-tree`. Any NEW C-using crate
  # without a DR will fail this gate and block the PR.
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check bans licenses
          arguments: --workspace

  # ── Format check (fast, runs first) ────────────────────────────────────────
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt
      - run: cargo fmt --check --all

  # ── Clippy lint (medium speed) ──────────────────────────────────────────────
  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: clippy
      - name: Clippy (core + working framework crates, lib only)
        run: cargo clippy ${{ env.CI_CRATES }} --lib -- -D warnings

  # ── Test-core (HARD gate, 3-OS matrix) ──────────────────────────────────────
  # P0.11: Core compiler crate tests.
  # Previously advisory due to pre-existing test failures; all resolved:
  # - project_pipeline fixtures fixed (PR #33)
  # - features/hint_for_diagnostic fixed (PR #33)
  # - buff-lang-ast/codegen-rust/runtime compilation errors fixed (PR #34)
  # - bench_cold_start CwdGuard race fixed (mutex serialization)
  # Framework crate tests are split into test-framework below.
  test-core:
    name: cargo test (core)
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: test-core-${{ matrix.os }}
      - name: Test (core compiler crates)
        run: cargo test -p buff-lang-ast -p buff-lang-lexer -p buff-lang-parser -p buff-lang-types -p buff-lang-error -p buff-lang-codegen-rust -p buff-lang-codegen-wgsl -p buff-lang-runtime -p buff-lang-debug-info -p buff-lang-cli

  # ── Test-framework (advisory, ubuntu only) ──────────────────────────────────
  # P0.11: Framework crate tests are continue-on-error (pre-existing API drift).
  test-framework:
    name: cargo test (framework)
    continue-on-error: true
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: test-framework
      - name: Test (framework crates)
        run: cargo test --workspace --exclude buff-lang-ast --exclude buff-lang-lexer --exclude buff-lang-parser --exclude buff-lang-types --exclude buff-lang-error --exclude buff-lang-codegen-rust --exclude buff-lang-codegen-wgsl --exclude buff-lang-runtime --exclude buff-lang-debug-info --exclude buff-lang-cli

  # ── Buff compiler validation (Linux, validates .buff files) ─────────────────
  buff-validation:
    name: buff check + run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: buff-validation
      - name: Build buff CLI
        run: cargo build --release -p buff-lang-cli
      - name: Validate .buff examples compile
        run: |
          BUFF=./target/release/buff
          FAIL=0
          for f in examples/*.buff; do
            echo "::group::buff check $f"
            if ! $BUFF check "$f" 2>&1; then
              echo "::warning file=$f::buff check failed (may be expected for forward-declared examples)"
            fi
            echo "::endgroup::"
          done
      - name: Validate golden outputs (buff run + compare)
        run: |
          BUFF=./target/release/buff
          PASS=0; SKIP=0; FAIL=0
          for f in examples/*.buff.expected; do
            SRC="${f%.expected}"
            if [ ! -f "$SRC" ]; then continue; fi
            echo "::group::buff run $SRC"
            if ACTUAL=$($BUFF run "$SRC" 2>&1); then
              EXPECTED=$(cat "$f")
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "PASS"
                PASS=$((PASS+1))
              else
                echo "::warning file=$SRC::Output mismatch"
                FAIL=$((FAIL+1))
              fi
            else
              echo "::warning file=$SRC::buff run failed (forward-declared, expected)"
              SKIP=$((SKIP+1))
            fi
            echo "::endgroup::"
          done
          echo "Results: $PASS passed, $FAIL failed, $SKIPPED skipped"

  # ── Installer lint (fast, checks for placeholder strings) ─────────────────
  installer-lint:
    name: Installer lint
    runs-on: ubuntu-latest
    # Advisory on PRs — sha256 hashes are filled by the release workflow.
    # Only gating on release (v* tags).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4 # v4
      - name: Check for placeholder strings in installer files
        run: |
          FAIL=0
          # Reject any placeholder patterns in installers/:
          #   - <FILL-ME or FILL_ME (legacy placeholders)
          #   - sha256 "" (empty hash — must be filled by release workflow)
          #   - sha256 "FILL (any FILL-prefixed placeholder)
          # The release workflow (release.yml job: update-sha256) fills all
          # hashes via update-sha256.sh before publishing.
          if grep -rnE 'sha256\s+("(FILL|<)|"")' installers/ 2>/dev/null; then
            echo "::error::Found placeholder sha256 in installer files (must be filled by release workflow)"
            FAIL=1
          fi
          for pattern in '<FILL-ME' 'FILL_ME'; do
            if grep -rn "$pattern" installers/ 2>/dev/null; then
              echo "::error::Found placeholder '$pattern' in installer files"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Installer files contain placeholder strings"
            exit 1
          fi
          echo "::notice::All installer files are free of placeholder strings"

  # ── Docker build validation ─────────────────────────────────────────────────
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build builder image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/builder.Dockerfile
          push: false
          tags: buff:builder-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Self-host bootstrap check (HARD GATE) ─────────────────────────────────
  # P0.2: The 7 baseline files below MUST pass `buff check` for any PR to merge.
  # Adding new files to this baseline requires team consensus.
  # Baseline files (self-host/):
  #   - parser/expr_pattern.buff
  #   - parser/expr_postfix.buff
  #   - parser/parser.buff
  #   - parser/stmt.buff
  #   - parser/stream.buff
  #   - types/lib.buff
  #   - types/prelude_types.buff
  self-host-check:
    name: Self-host bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: self-host
      - name: Build buff CLI
        run: cargo build --release -p buff-lang-cli
      - name: Check self-host corpus
        run: |
          BUFF=./target/release/buff
          PASS=0; FAIL=0; TOTAL=0
          for f in self-host/lexer/*.buff self-host/parser/*.buff self-host/types/*.buff self-host/codegen/*.buff; do
            [ -f "$f" ] || continue
            TOTAL=$((TOTAL+1))
            rm -rf target/buff-cache
            if $BUFF check "$f" 2>&1 | head -1 | grep -q "no issues"; then
              PASS=$((PASS+1))
              echo "PASS: $f"
            else
              FAIL=$((FAIL+1))
              echo "FAIL: $f"
            fi
          done
          echo "::notice::Self-host bootstrap: $PASS/$TOTAL files pass buff check"
          echo "Total: $TOTAL, Pass: $PASS, Fail: $FAIL"

  # ── Behavioral equivalence harness (HARD GATE) ──────────────────────────────
  # P0.1: Compares the stdout of 10 .buff self-host ports against their Rust
  # reference example binaries. Any divergence fails the build (no
  # continue-on-error). Ports are listed in scripts/equivalence-rust-vs-buff.sh.
  equivalence-check:
    name: Equivalence check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: equivalence
      - name: Build buff CLI
        run: cargo build --release -p buff-lang-cli
      - name: Run behavioral equivalence harness
        run: bash scripts/equivalence-rust-vs-buff.sh
      - name: Upload evidence artifacts (lms-001)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ github.sha }}
          path: .sisyphus/evidence/
          retention-days: 30
          if-no-files-found: warn
