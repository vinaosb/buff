name: Security

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Monday 9am UTC

# P0.10 — least-privilege default; the sbom job below overrides with
# `contents: write` (it attaches the SBOM to a GitHub Release via action-gh-release).
permissions:
  contents: read

jobs:
  cargo-audit:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        # W5/T31 finding: a root-level audit.toml is NOT auto-honored by
        # bare `cargo audit` on CI (PR #81: RUSTSEC-2026-0258 fired as a
        # fatal error despite being listed in audit.toml's ignore array).
        # The CLI flag is load-bearing; audit.toml remains the documented
        # per-ID rationale surface (enforced by the audit_toml_reasons
        # test), but the ignore itself must ALSO be passed here until
        # cargo-audit config discovery is solved (.cargo/audit.toml or
        # explicit --config).
        run: cargo audit --ignore RUSTSEC-2026-0258
        continue-on-error: false
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-audit-report
          path: |
            target/audit/**/*.json
            target/audit/**/*.md
          retention-days: 30

  sbom:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # softprops/action-gh-release attaches the SBOM to the release
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOM
        run: cargo cyclonedx -f json
      - name: Upload SBOM as release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: cyclonedx.json
