name: Docker

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata (builder)
        id: meta-builder
        uses: docker/metadata-action@v5
        with:
          images: buff
          tags: |
            type=semver,pattern={{version}},suffix=-builder
            type=semver,pattern={{major}}.{{minor}},suffix=-builder
            type=raw,value=latest-builder

      - name: Build and push (builder)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/builder.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-builder.outputs.tags }}
          labels: ${{ steps.meta-builder.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker metadata (slim)
        id: meta-slim
        uses: docker/metadata-action@v5
        with:
          images: buff
          tags: |
            type=semver,pattern={{version}},suffix=-slim
            type=semver,pattern={{major}}.{{minor}},suffix=-slim
            type=raw,value=latest-slim

      - name: Build and push (slim)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/slim.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
