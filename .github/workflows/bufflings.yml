name: Bufflings Solvability

on:
  push:
    paths:
      - "exercises/**"
      - "crates/bufflings/**"
  pull_request:
    paths:
      - "exercises/**"
      - "crates/bufflings/**"

jobs:
  bufflings-solvability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Build buff CLI
        run: cargo build -p buff-lang-cli --release
      - name: Build bufflings
        run: cargo build -p bufflings --release
      - name: Verify all solutions
        run: |
          ./target/release/bufflings verify-all-with-solutions
