[package]
name = "buff-playground-wasm"
version = "1.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Wasm transpile-only entry point for the Buff playground (lexer + parser + codegen-rust, no rustc/runtime/GPU)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
buff-lang-lexer.workspace = true
buff-lang-parser.workspace = true
buff-lang-codegen-rust.workspace = true
buff-lang-error.workspace = true
wasm-bindgen.workspace = true
serde_json.workspace = true
console_error_panic_hook.workspace = true

[dev-dependencies]
serde_json.workspace = true
