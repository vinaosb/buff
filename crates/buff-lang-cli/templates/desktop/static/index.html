<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{name}</title>
    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans",
                         "Helvetica Neue", sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
        }
        #main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        button {
            font-size: 1.2rem;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #0f3460;
            color: #e0e0e0;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #16213e;
        }
    </style>
</head>
<body>
    <div id="main">
        <h1>{name}</h1>
        <p>Loading Buff-Wasm-Dioxus frontend…</p>
    </div>
    <!--
        The Wasm bundle is served from the same directory.
        `buff ui build --desktop` generates `bundle.js` + `bundle_bg.wasm`
        via wasm-bindgen.
    -->
    <script src="bundle.js"></script>
</body>
</html>
