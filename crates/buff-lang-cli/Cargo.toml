[package]
name = "buff-lang-cli"
version = "1.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "buff"
path = "src/main.rs"

[lib]
name = "buff_lang_cli"
path = "src/lib.rs"

[dependencies]
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
toml.workspace = true
# T122: sha2 used to deterministically hash git-dependency URLs into stable
# checkout directory names (`~/.buff/git/<sha256(url)[..16]>/`). The same
# crate is already pinned at the workspace level (T124k Hash/HMAC prelude
# modules); we reuse the pin to avoid pulling a second version.
sha2.workspace = true
buff-lang-ast.workspace = true
buff-lang-lexer.workspace = true
buff-lang-parser.workspace = true
buff-lang-types.workspace = true
buff-lang-codegen-rust.workspace = true
buff-lang-error.workspace = true

[dev-dependencies]
insta.workspace = true
syn.workspace = true
