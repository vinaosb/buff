[package]
name = "buff-lang-cli"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "buff"
path = "src/main.rs"

[lib]
name = "buff_lang_cli"
path = "src/lib.rs"

[dependencies]
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# T122: sha2 used to deterministically hash git-dependency URLs into stable
# checkout directory names (`~/.buff/git/<sha256(url)[..16]>/`). The same
# crate is already pinned at the workspace level (T124k Hash/HMAC prelude
# modules); we reuse the pin to avoid pulling a second version.
sha2.workspace = true
# T127: package-management subcommands talk to the buff-registry HTTP
# API. `reqwest` (blocking client, rustls-tls) is used by
# `commands::{login, publish, install}` + the registry path of
# `commands::add`. `tar` packs the project's `.buff` sources into a
# `Vec<u8>` for `buff publish` and unpacks downloaded tarballs for
# `buff install`. Both workspace pins already mandate rustls /
# pure-Rust (no native C dep), matching the T127 task spec.
reqwest.workspace = true
tar.workspace = true
# T127: `base64` round-trips the tarball bytes inside the JSON publish
# envelope, mirroring the wire shape `buff-registry` expects
# (`PublishRequest { tarball_b64: String }`). Already pinned at the
# workspace level (T124h Web/Base64 prelude module); reused here
# without re-pinning.
base64.workspace = true
# T127: `semver` parses `name@version` specifiers on `buff add <name>`
# and matches them against the registry's resolve endpoint output.
# Already pinned at the workspace level (T126 buff-registry); reused
# here without re-pinning.
semver.workspace = true
# T127: `dirs::home_dir()` resolves the user home for the credential
# store (`~/.buff/credentials`) on `buff login`. Already pinned at the
# workspace level (T125c REPL history file); reused here without
# re-pinning.
dirs.workspace = true
buff-lang-ast.workspace = true
buff-lang-lexer.workspace = true
buff-lang-parser.workspace = true
buff-lang-types.workspace = true
buff-lang-codegen-rust.workspace = true
buff-lang-error.workspace = true
buff-lang-fmt.workspace = true
buff-lang-check.workspace = true
buff-lang-pipeline.workspace = true
# T24: `buff backtrace <LOG>` subcommand + `.buffmap` sidecar emission
# in the build pipeline. Pure consumer of the crate's public API
# (build_source_map + serialize_to_string + remap_panic_backtrace);
# NO compilation logic added to the CLI.
buff-lang-debug-info.workspace = true
# T133: `.buffhtml` SFC integration. The 3 core crates (ast-rsx, parser,
# codegen-buffhtml) shipped at commit 1d879f3 with the floor grammar
# (decision record `rsx-syntax-feasibility.md` Â§6). These deps wire them
# into the CLI's compile pipeline â€” see `pipeline::compile_buffhtml_to_rust`
# + `error_mapper::translate_buffhtml_rustc_errors`.
buff-lang-ast-rsx.workspace = true
buff-lang-buffhtml-parser.workspace = true
buff-lang-codegen-buffhtml.workspace = true
# T135: `buff ssr <file.buffhtml>` wraps the codegen-buffhtml output with
# an SSR driver `fn main()` that calls `buff_ui_dioxus::render_to_string`.
# The dep brings in the wrapper crate's SSR helper surface (render_to_string
# + VirtualDom + dioxus_ssr) AND the dioxus umbrella + dioxus-ssr transitively
# (already workspace-pinned at the workspace level alongside `dioxus`).
buff-ui-dioxus.workspace = true
# T133: `syn` + `prettyplease` are needed by `pipeline::inline_script_block`
# to transform the codegen-buffhtml `const __BUFF_SCRIPT_SOURCE: &str` holder
# into actual Rust statements inside the generated component fn body (the
# T133 floor "Rust-in-script-block pass-through" â€” see decision record Â§6
# MUST-ship list). Both already pinned at the workspace level; reused here
# without re-pinning.
syn.workspace = true
prettyplease.workspace = true
# T111: `buff profile` injects profiling guards into `fn main()` via
# `quote::quote!` + `syn::parse2` (the project-wide "no raw-string codegen"
# rule). `proc_macro2` is the TokenStream carrier type used by both `quote`
# and `syn::parse2`. Both already pinned at the workspace level (alongside
# `syn`); reused here without re-pinning.
quote.workspace = true
proc-macro2.workspace = true
# T125a: REPL delegation. `buff repl` is a thin shim that delegates to
# buff_repl::Repl::run() â€” all real logic (rustyline + buff-eval) lives
# in the dedicated crate.
buff-repl.workspace = true
# T129a: Jupyter kernel delegation. `buff jupyter install` /
# `buff jupyter start` are thin shims that delegate to
# buff_jupyter::install() / buff_jupyter::run_kernel() â€” all real
# protocol / HMAC / kernelspec logic lives in the dedicated crate.
# Pure-Rust deps (no libzmq, no OpenSSL) â€” verified to build on this
# Windows host.
buff-jupyter.workspace = true
# T131: `buff ui dev` dev-server dependencies. We pull `axum` 0.8 (the
# workspace-pinned HTTP framework â€” re-uses the same version
# `buff-registry` and the registry CLI integration tests already
# consume) for HTTP + WebSocket serving. axum 0.8 ships the
# `axum::extract::ws::WebSocketUpgrade` extractor + `axum::serve`
# API by default (the `ws` feature is on in the default feature set),
# so we get WebSocket support for free without a separate
# `tokio-tungstenite` direct dependency.
#
# `notify` is the file watcher. We pin to major 6 (workspace pin) for
# the reasons documented at the workspace dep declaration. Pure-Rust,
# no native C dep. T131 (dev server) + T64 (`buff watch` standalone
# subcommand) both consume the same `RecommendedWatcher` surface.
#
# `tower` is needed for the `ServiceExt` trait used in the dev-server
# unit tests (`tower::ServiceExt::oneshot` to drive the `Router`
# directly without TCP bind, mirroring the registry test pattern).
# Production code does NOT use tower â€” only test helpers.
axum.workspace = true
notify.workspace = true
# T131: `futures-util` provides the `SinkExt` + `StreamExt` traits the
# `/__buff_reload__` WebSocket handler uses to split the connection
# into sender + receiver halves and pump messages. Already pinned at
# the workspace level (T124m WebSocket prelude module); reused here
# without re-pinning.
futures-util.workspace = true
# T136: `buff debug` DAP translation proxy. The subcommand is a thin
# shim that delegates to buff_dap::run_session â€” all real protocol /
# translation / backend-spawn logic lives in the dedicated crate.
# Mirrors the buff-repl / buff-jupyter workspace path-dep pattern.
# Pure-Rust deps (serde + serde_json + thiserror + buff-lang-error) â€”
# verified to build on this Windows host (no native C dep).
buff-dap.workspace = true
# T72: `buff-plugins` â€” plugin extension points (compiler + LSP +
# runtime). `buff check` calls
# `buff_plugins::dispatch_global_compiler_lint` after the built-in
# linters when `BUFF_PLUGIN_DIR` / `BUFF_PLUGIN_PATH` is set (no-op
# otherwise). Pure-Rust trait-object dispatch (NO dlopen) â€” reuses
# the existing serde + toml + thiserror + syn + buff-lang-ast +
# buff-lang-error workspace pins. Minimal hook: 5 lines in
# `check.rs::check_source`; empty registry is a pure no-op.
buff-plugins.workspace = true
# T7: salsa-based incremental compilation front-end. The
# `incremental` module wraps the lex + parse + typecheck passes in
# salsa tracked queries so unchanged input files skip re-processing
# on subsequent `buff build` / `buff run` invocations within a single
# CLI session. Pure-Rust, no native deps (already workspace-pinned at
# the root level alongside `rayon` + `tokio`); reused here without
# re-pinning. The pipeline integration is opt-in via the
# `--incremental` / `--no-incremental` CLI flags (default: ON for
# dev Debug builds, OFF for Release/Minimal). Correctness is
# unaffected â€” salsa is purely a memoization cache; the underlying
# lex + parse + codegen pipeline is byte-identical with or without it.
salsa.workspace = true
# T111: `buff profile` CPU/allocation profiler. The three crates are
# listed in the CLI's [dependencies] for version-pinning via the
# workspace pin (the temp Cargo project generated by the profile
# subcommand references the SAME versions via string interpolation).
# `flamegraph` + `dhat` power flamegraph SVG rendering + allocation
# profiling respectively. Pure-Rust, no native deps — matches the
# "no C library, no Docker" hard rule. The profiling code is INJECTED
# into the user binary's `fn main()` via syn transform (see
# `pipeline::inject_profiling`); the CLI itself does not call these
# APIs directly except via the generated Cargo.toml version string.
flamegraph.workspace = true
dhat.workspace = true

# pprof 0.15 uses Unix-only libc types (pthread_t, siginfo_t, ucontext_t)
# that fail to compile on Windows. It is target-gated to Unix only; the
# `buff profile --cpu` code path emits a clear error on Windows instead.
[target.'cfg(unix)'.dependencies]
pprof.workspace = true

[dev-dependencies]
insta.workspace = true
syn.workspace = true
# T127: integration tests in `tests/registry_cli_t127.rs` drive the
# `buff-registry` HTTP app IN-PROCESS â€” they build
# `buff_registry::app(state)` and serve it on an ephemeral
# `tokio::net::TcpListener` bound to `127.0.0.1:0` via
# `axum::serve(listener, app)`, then point the CLI's reqwest client at
# that address. Pure-Rust, no native C deps, matches the "no Docker,
# no external services" mandate.
buff-registry.workspace = true
axum.workspace = true
# T131: `buff ui dev` unit tests drive the dev-server `Router<()>`
# in-process via `tower::ServiceExt::oneshot` â€” the same pattern the
# `buff-registry` integration tests use. Pure-Rust, no native C deps.
tower.workspace = true
