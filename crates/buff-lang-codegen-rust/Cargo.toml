[package]
name = "buff-lang-codegen-rust"
version = "1.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror.workspace = true
buff-lang-error.workspace = true
buff-lang-ast.workspace = true
buff-lang-types.workspace = true
# T24: post-format span-capture for `.buffmap` source-map sidecar.
# Consumes ONLY the public `build_source_map` + `SourceMap` types; does
# NOT add any compilation logic to this crate. Mirrors the
# `buff-lang-types` consumer pattern (analysis-only dep).
buff-lang-debug-info.workspace = true
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
prettyplease.workspace = true
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
insta.workspace = true
buff-lang-lexer.workspace = true
buff-lang-parser.workspace = true
# T22: dev-only standalone baseline-capture binary (`cargo run -p
# buff-lang-codegen-rust --example capture_t22_baseline`) reuses the
# workspace-pinned sha2 + serde + serde_json (NO new packages added to
# the workspace) so we can capture lex/parse/codegen timings + hashes
# on hosts where the full `buff-lang-cli` binary cannot link (e.g.
# Windows MSVC LNK1104 ring blocker). The binary is dev-only — it is
# NOT shipped and is NOT exposed via the buff CLI.
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true

[[example]]
name = "capture_t22_baseline"
path = "examples/capture_t22_baseline.rs"

# T19: bootstrap determinism gate driver. Pure-Rust (no ring/rustls), so it
# links on hosts where the full buff-lang-cli binary cannot (Windows MSVC
# LNK1104 vcruntime.h blocker — see self-host/msvc-env.ps1). Reuses the
# workspace-pinned sha2 + serde + serde_json already pulled in by the T22
# example; NO new deps added.
[[example]]
name = "bootstrap_t19"
path = "examples/bootstrap_t19.rs"
